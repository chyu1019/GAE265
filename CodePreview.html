                js: `const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];
const mouse = { x: null, y: null };

window.addEventListener('mousemove', (e) => {
  mouse.x = e.x;
  mouse.y = e.y;
  for (let i = 0; i < 3; i++) {
    particles.push(new Particle());
  }
});

class Particle {
  constructor() {
    this.x = mouse.x || canvas.width / 2;
    this.y = mouse.y || canvas.height / 2;
    this.size = Math.random() * 8 + 1;
    this.speedX = Math.random() * 3 - 1.5;
    this.speedY = Math.random() * 3 - 1.5;
    this.color = \`hsl(\${Math.random() * 360}, 100%, 50%)\`;
  }
  update() {
    this.x += this.speedX;
    this.y += this.speedY;
    if (this.size > 0.2) this.size -= 0.1;
  }
  draw() {
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

function animate() {
  ctx.fillStyle = 'rgba(5, 5, 5, 0.1)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  for (let i = 0; i < particles.length; i++) {
    particles[i].update();
    particles[i].draw();
    if (particles[i].size <= 0.2) {
      particles.splice(i, 1);
      i--;
    }
  }
  requestAnimationFrame(animate);
}

animate();
console.log('粒子動畫啟動成功！');`

        // 裝置視窗尺寸設定 (寬 x 高)

        };

        // Toast Notification Helper
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            const bgClass = type === 'error' ? 'bg-red-600' : type === 'success' ? 'bg-emerald-600' : 'bg-blue-600';
            const icon = type === 'error' ? 'fa-triangle-exclamation' : type === 'success' ? 'fa-circle-check' : 'fa-circle-info';

            toast.className = `${bgClass} text-white px-4 py-2.5 rounded-xl shadow-2xl text-xs font-medium flex items-center gap-2 transform transition-all duration-300 opacity-0 translate-y-2 pointer-events-auto`;
            toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${message}</span>`;
            
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('opacity-0', 'translate-y-2');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Clear Console UI
        function clearConsole() {
            consoleOutput.innerHTML = '';
            logCount = 0;
            logBadge.textContent = '0';
        }

        // Add Log Entry to Custom Console Panel
        function appendConsoleLog(type, message) {
            logCount++;
            logBadge.textContent = logCount;

            consoleOutput.appendChild(logRow);
            consoleOutput.scrollTop = consoleOutput.scrollHeight;

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');

            const consoleInterceptorScript = 
                '<' + 'script>' +
                '(function() {' +

                '      return String(arg);' +
                '    }).join(" ");' +

            const sourceDoc = `<!DOCTYPE html>

    <script>
        try {
${js}
        } catch (err) {
            console.error(err);
        }
    ${scriptClosing}
</body>
</html>`;

            const doc = previewIframe.contentDocument || previewIframe.contentWindow.document;
            doc.open();
            doc.write(sourceDoc);
            doc.close();

            // 同步更新獨立彈出視窗的內容
            if (popupWindow && !popupWindow.closed) {
                updatePopupWindowContent();
            }
        }

        // 重新繪製獨立視窗內容
        function updatePopupWindowContent() {
            if (!popupWindow || popupWindow.closed) return;
            const html = htmlInput.value;
            const css = cssInput.value;
            const js = jsInput.value;

            const scriptClosing = '</' + 'script>';
            const popupDoc = `<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>獨立預覽 - Preview</title>
    <style>
${css}
    </style>
</head>
<body>
${html}
    <script>
        try {
${js}
        } catch (err) {
            console.error(err);
        }
    ${scriptClosing}
</body>
</html>`;

            popupWindow.document.open();
            popupWindow.document.write(popupDoc);
            popupWindow.document.close();
        }

        // Open Preview in External Popup Window
        function openPopupPreview() {
            const dim = DEVICE_DIMENSIONS[currentDeviceSize] || DEVICE_DIMENSIONS['100%'];
            const features = `width=${dim.width},height=${dim.height},resizable=yes,scrollbars=yes`;

            if (popupWindow && !popupWindow.closed) {
                try {
                    popupWindow.resizeTo(dim.width, dim.height);
                    popupWindow.focus();
                } catch (e) {}
            } else {
                popupWindow = window.open('', 'CodePreviewStudioPopup', features);
            }

            if (!popupWindow) {
                showToast('請允許瀏覽器開啟彈出視窗', 'error');
                return;
            }

            updatePopupWindowContent();
            showToast('已開啟獨立預覽視窗！', 'success');
        }

        // Single File Downloader
        function downloadHtmlFile() {
            const html = htmlInput.value;
            const css = cssInput.value;
            const js = jsInput.value;

            const scriptClosing = '</' + 'script>';
            const fullContent = `<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exported Page</title>
    <style>
${css}
    </style>
</head>
<body>
${html}
    <script>
${js}
    ${scriptClosing}
</body>
</html>`;

            const blob = new Blob([fullContent], { type: 'text/html;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'index.html';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showToast('已開始下載 index.html 文件！', 'success');
        }

        // Update Stats Counters
        function updateStats() {
            htmlStats.textContent = `${htmlInput.value.length} 字元`;
            cssStats.textContent = `${cssInput.value.length} 字元`;
            jsStats.textContent = `${jsInput.value.length} 字元`;
        }

        // Schedule Auto Updates
        function triggerAutoUpdate() {
            updateStats();
            if (autoUpdateToggle.checked) {
                clearTimeout(updateTimeout);
                updateTimeout = setTimeout(renderPreview, 300);
            }
        }

        // Load Preset Code
        function loadPreset(key) {
            const data = PRESETS[key] || PRESETS.empty;
            htmlInput.value = data.html;
            cssInput.value = data.css;
            jsInput.value = data.js;
            updateStats();
            renderPreview();
            showToast('已載入選擇的範本', 'info');
        }

        // Tab Navigation Switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => {
                    b.classList.remove('active', 'bg-gray-800', 'text-orange-400', 'text-blue-400', 'text-yellow-400');
                    b.classList.add('text-gray-400');
                });

                btn.classList.add('active', 'bg-gray-800');
                btn.classList.remove('text-gray-400');

                const tab = btn.getAttribute('data-tab');
                const groups = {
                    html: document.getElementById('htmlGroup'),
                    css: document.getElementById('cssGroup'),
                    js: document.getElementById('jsGroup')
                };

                if (tab === 'all') {
                    Object.values(groups).forEach(g => g.classList.remove('hidden'));
                } else {
                    Object.keys(groups).forEach(k => {
                        if (k === tab) groups[k].classList.remove('hidden');
                        else groups[k].classList.add('hidden');
                    });
                }
            });
        });

        // Viewport Resizing Buttons
        document.querySelectorAll('.viewport-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.viewport-btn').forEach(b => {
                    b.classList.remove('active', 'text-white');
                    b.classList.add('text-gray-400');
                });
                btn.classList.add('active', 'text-white');
                btn.classList.remove('text-gray-400');
                
                const size = btn.getAttribute('data-size');
                currentDeviceSize = size;
                iframeWrapper.style.width = size;

                // 若獨立視窗已開啟，自動調整其寬高並聚焦
                if (popupWindow && !popupWindow.closed) {
                    const dim = DEVICE_DIMENSIONS[size] || DEVICE_DIMENSIONS['100%'];
                    try {
                        popupWindow.resizeTo(dim.width, dim.height);
                        popupWindow.focus();
                    } catch (e) {
                        console.warn('無法自動調整彈出視窗尺寸', e);
                    }
                }
            });
        });

        // Event Listeners for Code Editing
        [htmlInput, cssInput, jsInput].forEach(input => {
            input.addEventListener('input', triggerAutoUpdate);
            // Tab key indention support
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Tab') {
                    e.preventDefault();
                    const start = input.selectionStart;
                    const end = input.selectionEnd;
                    input.value = input.value.substring(0, start) + '  ' + input.value.substring(end);
                    input.selectionStart = input.selectionEnd = start + 2;
                    triggerAutoUpdate();
                }
            });
        });

        // Control Buttons Event Listeners
        runBtn.addEventListener('click', renderPreview);
        popupBtn.addEventListener('click', openPopupPreview);
        downloadBtn.addEventListener('click', downloadHtmlFile);
        clearConsoleBtn.addEventListener('click', clearConsole);

        presetSelect.addEventListener('change', (e) => loadPreset(e.target.value));

        clearCodeBtn.addEventListener('click', () => {
            if (confirm('確定要清空所有內容嗎？')) {
                htmlInput.value = '';
                cssInput.value = '';
                jsInput.value = '';
                updateStats();
                renderPreview();
                showToast('已清空程式碼', 'info');
            }
        });

        // Initialization on Load
        window.addEventListener('load', () => {
            loadPreset('welcome');
        });
    </script>
</body>
</html>
