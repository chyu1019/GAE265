<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Target Rush 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0c0e14;
            user-select: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 開始與結算畫面 */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 15, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        #start-screen h1 {
            color: #00ffcc;
            font-size: 3.5rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
            text-align: center;
        }

        #start-screen h2 {
            color: #ff3366;
            font-size: 1.5rem;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-align: center;
        }

        #start-screen p {
            color: #aaa;
            font-size: 1.1rem;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .play-btn {
            background: transparent;
            border: 2px solid #00ffcc;
            color: #00ffcc;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            border-radius: 4px;
            pointer-events: auto;
        }

        .play-btn:hover {
            background: #00ffcc;
            color: #111;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.6);
        }

        .instructions {
            margin-top: 30px;
            color: #888;
            font-size: 0.95rem;
            text-align: center;
            line-height: 1.6;
            background: rgba(0,0,0,0.4);
            padding: 15px 25px;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .instructions span {
            color: #00ffcc;
            font-weight: bold;
        }

        /* HUD 介面 */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none;
            z-index: 5;
        }

        .hud-element {
            position: absolute;
            color: #fff;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        #hp-display {
            top: 20px;
            left: 20px;
            font-size: 1.8rem;
            color: #ffaa00;
        }

        #timer-display {
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.2rem;
            color: #00ffcc;
            background: rgba(0,0,0,0.5);
            padding: 5px 20px;
            border-radius: 8px;
            border: 1px solid #00ffcc;
        }

        #score-display {
            top: 20px;
            right: 20px;
            font-size: 1.8rem;
            color: #ff3366;
        }

        #level-display {
            top: 70px;
            right: 20px;
            font-size: 1.4rem;
            color: #33ccff;
        }

        #ammo-display {
            bottom: 20px;
            right: 20px;
            font-size: 1.8rem;
            color: #00ffcc;
        }

        #reload-prompt {
            bottom: 70px;
            right: 20px;
            font-size: 1.2rem;
            color: #ff3333;
            display: none;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        /* 準心 */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            pointer-events: none;
            z-index: 5;
            display: none;
        }

        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(0, 255, 204, 0.9);
            box-shadow: 0 0 4px #00ffcc;
        }

        #crosshair::before {
            top: 4px;
            left: -6px;
            width: 22px;
            height: 2px;
        }

        #crosshair::after {
            top: -6px;
            left: 4px;
            width: 2px;
            height: 22px;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- 開始與結算畫面 -->
    <div id="start-screen">
        <h1>TARGET RUSH 3D</h1>
        <h2></h2>
        <p id="high-score-record">最高得分: 0 分</p>
        <button class="play-btn">[ CLICK TO PLAY ]</button>
        <div class="instructions">
            移動: <span>W A S D</span> | 跳躍: <span>Space</span> | 跑步: <span>Shift</span><br>
            射擊: <span>滑鼠左鍵</span> | 裝填: <span>R 鍵</span> | 離開指標: <span>ESC</span><br>
            提示: 單關獲得 10 分以上即可過關！擊中目標自動補充 5 發子彈！Lv.3 起目標會移動！
        </div>
    </div>

    <!-- 遊戲 HUD -->
    <div id="hud">
        <div id="hp-display" class="hud-element">High Score: 0</div>
        <div id="timer-display" class="hud-element">50.0s</div>
        <div id="score-display" class="hud-element">Score: 0</div>
        <div id="level-display" class="hud-element">Level: 1</div>
        <div id="ammo-display" class="hud-element">Ammo: 30 / 30</div>
        <div id="reload-prompt" class="hud-element">RELOADING...</div>
    </div>

    <div id="crosshair"></div>

    <script>
        class InputManager {
            constructor() {
                this.keys = {};
                this.mouseMovement = { x: 0, y: 0 };
                this.isLocked = false;
                this.leftMouseDown = false;
                this.rightMouseDown = false;
                this.reloadPressed = false;

                window.addEventListener('keydown', (e) => {
                    this.keys[e.code] = true;
                    if (e.code === 'KeyR') {
                        this.reloadPressed = true;
                    }
                });

                window.addEventListener('keyup', (e) => {
                    this.keys[e.code] = false;
                });

                document.addEventListener('mousemove', (e) => {
                    if (this.isLocked) {
                        this.mouseMovement.x += e.movementX || e.mozMovementX || e.webkitMovementX || 0;
                        this.mouseMovement.y += e.movementY || e.mozMovementY || e.webkitMovementY || 0;
                    }
                });

                document.addEventListener('mousedown', (e) => {
                    if (!this.isLocked) return;
                    if (e.button === 0) this.leftMouseDown = true;
                    if (e.button === 2) this.rightMouseDown = true;
                });

                document.addEventListener('mouseup', (e) => {
                    if (e.button === 0) this.leftMouseDown = false;
                    if (e.button === 2) this.rightMouseDown = false;
                });
            }

            isKeyPressed(code) {
                return !!this.keys[code];
            }

            getMouseMovement() {
                const movement = { ...this.mouseMovement };
                this.mouseMovement.x = 0;
                this.mouseMovement.y = 0;
                return movement;
            }
        }

        class UIManager {
            constructor() {
                this.startScreen = document.getElementById('start-screen');
                this.hud = document.getElementById('hud');
                this.crosshair = document.getElementById('crosshair');
                this.hpEl = document.getElementById('hp-display');
                this.scoreEl = document.getElementById('score-display');
                this.timerEl = document.getElementById('timer-display');
                this.levelEl = document.getElementById('level-display');
                this.ammoEl = document.getElementById('ammo-display');
                this.reloadPrompt = document.getElementById('reload-prompt');
                this.highScoreRecord = document.getElementById('high-score-record');
                
                this.highScore = 0;
            }

            showGameUI() {
                this.startScreen.style.display = 'none';
                this.hud.style.display = 'block';
                this.crosshair.style.display = 'block';
            }

            showScreen(titleText, subtitleText, btnText, finalScore = 0) {
                this.startScreen.style.display = 'flex';
                this.hud.style.display = 'none';
                this.crosshair.style.display = 'none';

                if (finalScore > this.highScore) {
                    this.highScore = finalScore;
                }

                const titleH1 = this.startScreen.querySelector('h1');
                const titleH2 = this.startScreen.querySelector('h2');
                const playBtn = this.startScreen.querySelector('.play-btn');

                titleH1.innerText = "TARGET RUSH 3D";
                titleH2.innerText = subtitleText;
                playBtn.innerText = btnText;
                this.highScoreRecord.innerText = `最高得分: ${this.highScore} 分`;
            }

            updateHUD(highScore, score, ammo, maxAmmo, reserveAmmo, timeLeft, isReloading, level) {
                this.hpEl.innerText = `High Score: ${highScore}`;
                this.scoreEl.innerText = `Score: ${score}`;
                this.levelEl.innerText = `Level: ${level}`;
                this.timerEl.innerText = `${Math.max(0, timeLeft).toFixed(1)}s`;
                this.ammoEl.innerText = `Ammo: ${ammo} / ${reserveAmmo}`;
                this.reloadPrompt.style.display = isReloading ? 'block' : 'none';
            }
        }

        class Weapon {
            constructor(camera, scene) {
                this.camera = camera;
                this.scene = scene;

                this.ammo = 30;
                this.maxClip = 30;
                this.reserveAmmo = 30;
                this.maxReserveAmmo = 30;
                this.fireRate = 0.1;
                this.lastShotTime = 0;
                this.isReloading = false;
                this.reloadTime = 2.0;
                this.reloadTimer = 0;

                this.raycaster = new THREE.Raycaster();
                this.mouse = new THREE.Vector2(0, 0); // 螢幕正中央
            }

            reset() {
                this.ammo = 30;
                this.reserveAmmo = 30;
                this.isReloading = false;
                this.reloadTimer = 0;
                this.lastShotTime = 0;
            }

            addAmmo(amount) {
                this.reserveAmmo = Math.min(this.maxReserveAmmo, this.reserveAmmo + amount);
                this.ammo = Math.min(this.maxClip, this.ammo + amount);
            }

            update(delta, inputManager, camera, targetManager, clock) {
                if (this.isReloading) {
                    this.reloadTimer -= delta;
                    if (this.reloadTimer <= 0) {
                        this.isReloading = false;
                        const needed = this.maxClip - this.ammo;
                        const reloadAmount = Math.min(needed, this.reserveAmmo);
                        this.ammo += reloadAmount;
                        this.reserveAmmo -= reloadAmount;
                    }
                    return;
                }

                if (inputManager.reloadPressed) {
                    inputManager.reloadPressed = false;
                    if (!this.isReloading && this.ammo < this.maxClip && this.reserveAmmo > 0) {
                        this.isReloading = true;
                        this.reloadTimer = this.reloadTime;
                    }
                }

                if (inputManager.leftMouseDown) {
                    const now = clock.getElapsedTime();
                    if (now - this.lastShotTime >= this.fireRate) {
                        if (this.ammo > 0) {
                            this.shoot(camera, targetManager);
                            this.lastShotTime = now;
                        } else if (!this.isReloading && this.reserveAmmo > 0) {
                            this.isReloading = true;
                            this.reloadTimer = this.reloadTime;
                        }
                    }
                }
            }

            shoot(camera, targetManager) {
                this.ammo--;
                this.createMuzzleFlash(camera);

                this.raycaster.setFromCamera(this.mouse, camera);
                const targetMeshes = targetManager.getTargetMeshes();
                const intersects = this.raycaster.intersectObjects(targetMeshes);

                if (intersects.length > 0) {
                    const hit = intersects[0];
                    targetManager.hitTarget(hit.object);
                }
            }

            createMuzzleFlash(camera) {
                const flashGeo = new THREE.SphereGeometry(0.1, 8, 8);
                const flashMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
                const flash = new THREE.Mesh(flashGeo, flashMat);
                
                flash.position.set(0.3, -0.2, -0.8);
                camera.add(flash);

                setTimeout(() => {
                    camera.remove(flash);
                }, 40);
            }
        }

        class TargetManager {
            constructor(scene, onScoreCallback) {
                this.scene = scene;
                this.onScoreCallback = onScoreCallback;
                this.targets = [];
                this.spawnTimer = 0;
                this.spawnInterval = 4.0;
                this.meshToTargetMap = new Map();
            }

            reset() {
                for (let t of this.targets) {
                    this.scene.remove(t.mesh);
                    t.mesh.geometry.dispose();
                    t.mesh.material.dispose();
                }
                this.targets = [];
                this.meshToTargetMap.clear();
                this.spawnTimer = 0;
            }

            update(delta, time, level) {
                this.spawnTimer += delta;
                if (this.spawnTimer >= this.spawnInterval) {
                    this.spawnTimer = 0;
                    this.spawnTarget();
                }

                for (let i = this.targets.length - 1; i >= 0; i--) {
                    const t = this.targets[i];
                    // 永遠保留上下輕微浮動
                    t.mesh.position.y = t.initialY + Math.sin(time * t.speed + t.timeOffset) * 1.5;

                    // 嚴格規定：Level 1 與 Level 2 目標物絕對不左右移動（X 軸固定）
                    if (level >= 3) {
                        // 從 Level 3 開始，每升 1 級速度增加 10%
                        const speedMultiplier = 1.0 + (level - 3) * 0.1;
                        t.mesh.position.x = t.initialX + Math.sin(time * 0.8 * t.speed + t.timeOffset) * 6.0 * speedMultiplier;
                    } else {
                        t.mesh.position.x = t.initialX;
                    }
                }
            }

            spawnTarget() {
                if (this.targets.length >= 8) return;

                const geometry = new THREE.DodecahedronGeometry(1.2);
                const material = new THREE.MeshStandardMaterial({
                    color: 0xff3366,
                    emissive: 0xff0044,
                    emissiveIntensity: 0.8,
                    roughness: 0.2,
                    metalness: 0.8
                });

                const mesh = new THREE.Mesh(geometry, material);

                const x = (Math.random() - 0.5) * 50;
                const z = -Math.random() * 45 - 5;
                const y = Math.random() * 4 + 2;

                mesh.position.set(x, y, z);
                mesh.castShadow = true;
                this.scene.add(mesh);

                const targetData = {
                    mesh: mesh,
                    initialX: x,
                    initialY: y,
                    timeOffset: Math.random() * 10,
                    speed: (0.5 + Math.random() * 1.5)
                };

                this.targets.push(targetData);
                this.meshToTargetMap.set(mesh.uuid, targetData);

                const pLight = new THREE.PointLight(0xff3366, 1.5, 6);
                mesh.add(pLight);
            }

            getTargetMeshes() {
                return this.targets.map(t => t.mesh);
            }

            hitTarget(mesh) {
                const targetData = this.meshToTargetMap.get(mesh.uuid);
                if (!targetData) return;

                this.createExplosion(mesh.position);

                this.scene.remove(mesh);
                mesh.geometry.dispose();
                mesh.material.dispose();

                const index = this.targets.indexOf(targetData);
                if (index > -1) {
                    this.targets.splice(index, 1);
                }
                this.meshToTargetMap.delete(mesh.uuid);

                if (this.onScoreCallback) {
                    this.onScoreCallback();
                }

                this.spawnTarget();
            }

            createExplosion(pos) {
                const particleCount = 15;
                const geometry = new THREE.BufferGeometry();
                const positions = [];
                const velocities = [];

                for (let i = 0; i < particleCount; i++) {
                    positions.push(pos.x, pos.y, pos.z);
                    velocities.push(
                        (Math.random() - 0.5) * 8,
                        (Math.random() - 0.5) * 8 + 4,
                        (Math.random() - 0.5) * 8
                    );
                }

                geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                const material = new THREE.PointsMaterial({
                    color: 0xffaa00,
                    size: 0.4,
                    transparent: true,
                    opacity: 1.0
                });

                const particleSystem = new THREE.Points(geometry, material);
                this.scene.add(particleSystem);

                let life = 0.5;
                const animateExplosion = () => {
                    life -= 0.02;
                    if (life <= 0) {
                        this.scene.remove(particleSystem);
                        geometry.dispose();
                        material.dispose();
                        return;
                    }

                    const posAttr = geometry.attributes.position;
                    for (let i = 0; i < particleCount; i++) {
                        posAttr.setXYZ(
                            i,
                            posAttr.getX(i) + velocities[i] * 0.02,
                            posAttr.getY(i) + velocities[i + 1] * 0.02,
                            posAttr.getZ(i) + velocities[i + 2] * 0.02
                        );
                    }
                    posAttr.needsUpdate = true;
                    material.opacity = life * 2;
                    requestAnimationFrame(animateExplosion);
                };
                animateExplosion();
            }
        }

        class Player {
            constructor(camera, inputManager, scene) {
                this.camera = camera;
                this.input = inputManager;
                this.scene = scene;

                this.position = new THREE.Vector3(0, 2, 15);
                this.velocity = new THREE.Vector3();
                this.camera.position.copy(this.position);

                this.pitch = 0;
                this.yaw = 0;

                this.moveSpeed = 6.0;
                this.sprintMultiplier = 1.6;
                this.jumpForce = 8.0;
                this.gravity = 22.0;
                this.canJump = false;
                this.playerRadius = 0.6;
                this.colliders = [];
            }

            reset() {
                this.position.set(0, 2, 15);
                this.velocity.set(0, 0, 0);
                this.pitch = 0;
                this.yaw = 0;
                this.camera.position.copy(this.position);
                this.camera.rotation.set(0, 0, 0);
            }

            addCollider(mesh) {
                this.colliders.push(mesh);
            }

            update(delta) {
                const mouse = this.input.getMouseMovement();
                const sensitivity = 0.002;

                this.yaw -= mouse.x * sensitivity;
                this.pitch -= mouse.y * sensitivity;

                const maxPitch = Math.PI / 2 - 0.01;
                this.pitch = Math.max(-maxPitch, Math.min(maxPitch, this.pitch));

                this.camera.rotation.set(0, 0, 0);
                this.camera.rotateY(this.yaw);
                this.camera.rotateX(this.pitch);

                let forward = 0;
                let right = 0;

                if (this.input.isKeyPressed('KeyW')) forward += 1;
                if (this.input.isKeyPressed('KeyS')) forward -= 1;
                if (this.input.isKeyPressed('KeyA')) right -= 1;
                if (this.input.isKeyPressed('KeyD')) right += 1;

                const isSprinting = this.input.isKeyPressed('ShiftLeft') || this.input.isKeyPressed('ShiftRight');
                let currentSpeed = this.moveSpeed * (isSprinting ? this.sprintMultiplier : 1.0);

                const moveDir = new THREE.Vector3();
                const forwardVec = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), this.yaw);
                const rightVec = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), this.yaw);

                moveDir.addScaledVector(forwardVec, forward);
                moveDir.addScaledVector(rightVec, right);
                moveDir.normalize();

                this.velocity.x = moveDir.x * currentSpeed;
                this.velocity.z = moveDir.z * currentSpeed;

                if (this.input.isKeyPressed('Space') && this.canJump) {
                    this.velocity.y = this.jumpForce;
                    this.canJump = false;
                }

                this.velocity.y -= this.gravity * delta;

                let newX = this.position.x + this.velocity.x * delta;
                let newZ = this.position.z + this.velocity.z * delta;
                let newY = this.position.y + this.velocity.y * delta;

                if (newY <= 2.0) {
                    newY = 2.0;
                    this.velocity.y = 0;
                    this.canJump = true;
                }

                newX = Math.max(-45, Math.min(45, newX));
                newZ = Math.max(-45, Math.min(45, newZ));

                for (let box of this.colliders) {
                    const boxPos = box.position;
                    const scale = box.scale;
                    if (Math.abs(newX - boxPos.x) < scale.x / 2 + this.playerRadius &&
                        Math.abs(newZ - boxPos.z) < scale.z / 2 + this.playerRadius &&
                        newY < boxPos.y + scale.y) {
                        newX = this.position.x;
                        newZ = this.position.z;
                    }
                }

                this.position.set(newX, newY, newZ);
                this.camera.position.copy(this.position);
            }
        }

        class Game {
            constructor() {
                this.container = document.getElementById('canvas-container');
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x0c0e14);
                this.scene.fog = new THREE.FogExp2(0x0c0e14, 0.015);

                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                this.container.appendChild(this.renderer.domElement);

                this.inputManager = new InputManager();
                this.uiManager = new UIManager();
                this.player = new Player(this.camera, this.inputManager, this.scene);
                
                this.weapon = new Weapon(this.camera, this.scene);
                this.targetManager = new TargetManager(this.scene, () => {
                    this.score++; // 總得分
                    this.levelScore++; // 該關得分
                    this.weapon.addAmmo(5); // 擊中目標自動補充 5 發子彈
                });

                this.score = 0;
                this.levelScore = 0; // 該關當前得分
                this.level = 1;
                this.timeLeft = 50.0;
                this.clock = new THREE.Clock();
                this.isRunning = false;

                this.initLights();
                this.initMap();
                this.initEvents();
            }

            initLights() {
                const ambientLight = new THREE.AmbientLight(0x446688, 1.2);
                this.scene.add(ambientLight);

                const dirLight = new THREE.DirectionalLight(0x00ffff, 1.0);
                dirLight.position.set(30, 50, 30);
                dirLight.castShadow = true;
                dirLight.shadow.mapSize.width = 2048;
                dirLight.shadow.mapSize.height = 2048;
                this.scene.add(dirLight);

                const pointLight1 = new THREE.PointLight(0xff0055, 3, 40);
                pointLight1.position.set(-15, 8, -15);
                this.scene.add(pointLight1);

                const pointLight2 = new THREE.PointLight(0x00ffcc, 3, 40);
                pointLight2.position.set(15, 8, 15);
                this.scene.add(pointLight2);
            }

            initMap() {
                const groundGeo = new THREE.PlaneGeometry(100, 100, 50, 50);
                const groundMat = new THREE.MeshStandardMaterial({ 
                    color: 0x222633, 
                    roughness: 0.7,
                    metalness: 0.3
                });
                const ground = new THREE.Mesh(groundGeo, groundMat);
                ground.rotation.x = -Math.PI / 2;
                ground.receiveShadow = true;
                this.scene.add(ground);

                const gridHelper = new THREE.GridHelper(100, 50, 0x00ffcc, 0x444444);
                gridHelper.position.y = 0.02;
                this.scene.add(gridHelper);

                const wallMat = new THREE.MeshStandardMaterial({ color: 0x3a4452, roughness: 0.4, metalness: 0.6 });
                const containerMat1 = new THREE.MeshStandardMaterial({ color: 0xcc4444, roughness: 0.4, metalness: 0.6 });
                const containerMat2 = new THREE.MeshStandardMaterial({ color: 0x4477cc, roughness: 0.4, metalness: 0.6 });
                const bunkerMat = new THREE.MeshStandardMaterial({ color: 0x4a5562, roughness: 0.6, metalness: 0.4 });

                const mainBuildingGeo = new THREE.BoxGeometry(16, 8, 16);
                const mainBuilding = new THREE.Mesh(mainBuildingGeo, wallMat);
                mainBuilding.position.set(0, 4, -25);
                mainBuilding.castShadow = true;
                mainBuilding.receiveShadow = true;
                this.scene.add(mainBuilding);
                this.player.addCollider(mainBuilding);

                const roofLightGeo = new THREE.BoxGeometry(16.2, 0.4, 16.2);
                const roofLightMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc });
                const roofLight = new THREE.Mesh(roofLightGeo, roofLightMat);
                roofLight.position.set(0, 8.2, -25);
                this.scene.add(roofLight);

                const createContainer = (x, z, rotY, mat) => {
                    const geo = new THREE.BoxGeometry(4, 3, 8);
                    const mesh = new THREE.Mesh(geo, mat);
                    mesh.position.set(x, 1.5, z);
                    mesh.rotation.y = rotY;
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    this.scene.add(mesh);
                    this.player.addCollider(mesh);
                };

                createContainer(-12, -8, 0, containerMat1);
                createContainer(-16, -8, 0, containerMat2);
                createContainer(12, 10, Math.PI / 4, containerMat1);
                createContainer(15, 12, Math.PI / 4, containerMat2);

                const createBarrier = (x, z, width, depth) => {
                    const geo = new THREE.BoxGeometry(width, 2, depth);
                    const mesh = new THREE.Mesh(geo, bunkerMat);
                    mesh.position.set(x, 1, z);
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    this.scene.add(mesh);
                    this.player.addCollider(mesh);
                };

                createBarrier(-15, 10, 8, 2);
                createBarrier(15, -10, 2, 8);
                createBarrier(0, 15, 10, 2);

                const boundaryGeo = new THREE.BoxGeometry(100, 4, 1);
                const makeBoundary = (x, z, ry) => {
                    const b = new THREE.Mesh(boundaryGeo, wallMat);
                    b.position.set(x, 2, z);
                    b.rotation.y = ry;
                    this.scene.add(b);
                    this.player.addCollider(b);
                };
                makeBoundary(0, -50, 0);
                makeBoundary(0, 50, 0);
                makeBoundary(-50, 0, Math.PI / 2);
                makeBoundary(50, 0, Math.PI / 2);
            }

            initEvents() {
                const startScreen = document.getElementById('start-screen');
                const playBtn = startScreen.querySelector('.play-btn');

                const requestPointerLockHandler = (e) => {
                    e.stopPropagation();
                    document.body.requestPointerLock();
                };

                playBtn.onclick = requestPointerLockHandler;
                startScreen.onclick = requestPointerLockHandler;

                document.addEventListener('pointerlockchange', () => {
                    if (document.pointerLockElement === document.body) {
                        this.inputManager.isLocked = true;
                        this.uiManager.showGameUI();
                        if (!this.isRunning) {
                            this.clock.start();
                            this.isRunning = true;
                        }
                    } else {
                        this.inputManager.isLocked = false;
                        if (this.isRunning) {
                            this.isRunning = false;
                            this.uiManager.showScreen("PAUSED", `當前得分: ${this.score} 分 (Level ${this.level})`, "[ RESUME GAME ]", this.score);
                        }
                    }
                });

                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });
            }

            startNewGame(isNextLevel = false) {
                if (!isNextLevel) {
                    this.score = 0;
                    this.level = 1;
                }
                this.levelScore = 0; // 重設該關得分
                this.timeLeft = 50.0;
                this.player.reset();
                this.weapon.reset();
                this.targetManager.reset();
                this.targetManager.spawnTarget();
                this.clock.start();
                this.isRunning = true;
            }

            start() {
                this.animate();
            }

            animate = () => {
                requestAnimationFrame(this.animate);

                if (!this.isRunning) {
                    this.renderer.render(this.scene, this.camera);
                    return;
                }

                const delta = this.clock.getDelta();
                const elapsedTime = this.clock.getElapsedTime();

                this.timeLeft -= delta;
                if (this.timeLeft <= 0) {
                    this.timeLeft = 0;
                    this.isRunning = false;
                    document.exitPointerLock();

                    // 檢查該關得分是否 >= 10 分
                    if (this.levelScore >= 10) {
                        this.level++;
                        this.uiManager.showScreen(
                            `LEVEL ${this.level - 1} COMPLETED!`, 
                            `恭喜過關！本關得分: ${this.levelScore} 分。準備進入 Level ${this.level}`, 
                            `[ START LEVEL ${this.level} ]`, 
                            this.score
                        );
                        
                        const startScreen = document.getElementById('start-screen');
                        const playBtn = startScreen.querySelector('.play-btn');
                        
                        const nextLevelHandler = (e) => {
                            e.stopPropagation();
                            this.startNewGame(true);
                            document.body.requestPointerLock();
                        };
                        playBtn.onclick = nextLevelHandler;
                        startScreen.onclick = nextLevelHandler;
                    } else {
                        this.uiManager.showScreen(
                            "TIME'S UP!", 
                            `本關僅得 ${this.levelScore} 分，未達 10 分過關標準！`, 
                            "[ TRY AGAIN ]", 
                            this.score
                        );
                        const startScreen = document.getElementById('start-screen');
                        const playBtn = startScreen.querySelector('.play-btn');
                        const retryHandler = (e) => {
                            e.stopPropagation();
                            this.startNewGame(false);
                            document.body.requestPointerLock();
                        };
                        playBtn.onclick = retryHandler;
                        startScreen.onclick = retryHandler;
                        this.level = 1;
                    }
                    return;
                }

                this.player.update(delta);
                this.weapon.update(delta, this.inputManager, this.camera, this.targetManager, this.clock);
                this.targetManager.update(delta, elapsedTime, this.level);

                this.uiManager.updateHUD(
                    this.uiManager.highScore,
                    this.score,
                    this.weapon.ammo,
                    this.weapon.maxClip,
                    this.weapon.reserveAmmo,
                    this.timeLeft,
                    this.weapon.isReloading,
                    this.level
                );

                this.renderer.render(this.scene, this.camera);
            }
        }

        window.addEventListener('load', () => {
            const game = new Game();
            game.start();
        });
    </script>
</body>
</html>
