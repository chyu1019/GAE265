<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D FPS Demo - Phase 2 (Fixed)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* 準星 UI */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
        }

        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background-color: rgba(0, 255, 200, 0.8);
        }

        #crosshair::before {
            top: 4px;
            left: 0;
            width: 10px;
            height: 2px;
        }

        #crosshair::after {
            top: 0;
            left: 4px;
            width: 2px;
            height: 10px;
        }

        /* HUD 抬頭顯示器 */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            padding: 20px;
            color: #00ffcc;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(0, 255, 200, 0.5);
        }

        .hud-panel {
            position: absolute;
            background: rgba(10, 20, 30, 0.65);
            border: 1px solid rgba(0, 255, 200, 0.3);
            padding: 10px 20px;
            border-radius: 4px;
            backdrop-filter: blur(4px);
        }

        #hud-top-left {
            top: 20px;
            left: 20px;
            font-size: 20px;
        }

        #hud-top-right {
            top: 20px;
            right: 20px;
            font-size: 20px;
        }

        #hud-bottom-right {
            bottom: 20px;
            right: 20px;
            font-size: 24px;
            text-align: right;
        }

        /* Phase 2: F3 Debug 面板 */
        #debug-panel {
            position: absolute;
            top: 100px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #00ffcc;
            padding: 12px;
            border-radius: 6px;
            color: #00ffcc;
            font-family: monospace;
            font-size: 14px;
            display: none;
            pointer-events: none;
            z-index: 15;
            line-height: 1.5;
            min-width: 260px;
        }

        /* 開始畫面遮罩 */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(15,25,35,0.92) 0%, rgba(5,10,15,0.98) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            color: #fff;
            cursor: pointer;
        }

        #start-screen h1 {
            font-size: 48px;
            letter-spacing: 4px;
            color: #00ffcc;
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(0, 255, 200, 0.6);
        }

        #start-screen p {
            font-size: 20px;
            color: #88ffdd;
            border: 2px solid #00ffcc;
            padding: 12px 30px;
            border-radius: 30px;
            background: rgba(0, 255, 200, 0.1);
            transition: all 0.3s ease;
        }

        #start-screen p:hover {
            background: rgba(0, 255, 200, 0.3);
            box-shadow: 0 0 20px rgba(0, 255, 200, 0.5);
        }

        .instructions {
            margin-top: 40px;
            color: #aaa;
            font-size: 14px;
            line-height: 1.6;
            text-align: center;
        }
    </style>
    <!-- 使用 CDN 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="game-container">
        <!-- 準星 -->
        <div id="crosshair"></div>

        <!-- Debug 面板 (F3) -->
        <div id="debug-panel">
            <div><strong>[ DEBUG MODE (F3) ]</strong></div>
            <div>FPS: <span id="dbg-fps">60</span></div>
            <div>Position: <span id="dbg-pos">X: 0 Y: 0 Z: 0</span></div>
            <div>Velocity: <span id="dbg-vel">0.0</span></div>
            <div>Grounded: <span id="dbg-ground">true</span></div>
            <div>Map: <span id="dbg-map">MilitaryBase</span></div>
        </div>

        <!-- HUD UI -->
        <div id="hud">
            <div id="hud-top-left" class="hud-panel">HP: <span id="hp-val">100</span></div>
            <div id="hud-top-right" class="hud-panel">Score: <span id="score-val">0</span></div>
            <div id="hud-bottom-right" class="hud-panel">AMMO: <span id="ammo-val">30</span> / <span id="max-ammo-val">120</span></div>
        </div>

        <!-- 開始畫面 overlay -->
        <div id="start-screen">
            <h1>3D FPS DEMO - PHASE 2</h1>
            <p>[ CLICK TO EXPLORE BASE ]</p>
            <div class="instructions">
                控制說明：<br>
                WASD：移動 | Shift：衝刺 | Space：跳躍<br>
                滑鼠移動：視角旋轉 | F3：開啟偵錯面板
            </div>
        </div>
    </div>

    <script>
        /**
         * InputManager - 負責鍵盤、滑鼠以及 F3 偵錯切換
         */
        class InputManager {
            constructor() {
                this.keys = {};
                this.mouseMovementX = 0;
                this.mouseMovementY = 0;
                this.isPointerLocked = false;
                this.onToggleDebug = null; // 回呼函數

                this.initListeners();
            }

            initListeners() {
                window.addEventListener('keydown', (e) => {
                    this.keys[e.code] = true;
                    // 按下 F3 切換 Debug 面板
                    if (e.code === 'F3') {
                        e.preventDefault();
                        if (this.onToggleDebug) this.onToggleDebug();
                    }
                });

                window.addEventListener('keyup', (e) => {
                    this.keys[e.code] = false;
                });

                document.addEventListener('mousemove', (e) => {
                    if (this.isPointerLocked) {
                        this.mouseMovementX += e.movementX || e.clientX - window.innerWidth / 2 || 0;
                        this.mouseMovementY += e.movementY || e.clientY - window.innerHeight / 2 || 0;
                    }
                });
            }

            getKey(code) {
                return !!this.keys[code];
            }

            getMouseDelta() {
                const delta = { x: this.mouseMovementX, y: this.mouseMovementY };
                this.mouseMovementX = 0;
                this.mouseMovementY = 0;
                return delta;
            }
        }

        /**
         * UIManager - 負責介面、HUD 與 F3 偵錯資訊更新
         */
        class UIManager {
            constructor() {
                this.startScreen = document.getElementById('start-screen');
                this.debugPanel = document.getElementById('debug-panel');
                this.hpVal = document.getElementById('hp-val');
                this.scoreVal = document.getElementById('score-val');
                this.ammoVal = document.getElementById('ammo-val');
                this.maxAmmoVal = document.getElementById('max-ammo-val');
                
                // Debug 元素
                this.dbgFps = document.getElementById('dbg-fps');
                this.dbgPos = document.getElementById('dbg-pos');
                this.dbgVel = document.getElementById('dbg-vel');
                this.dbgGround = document.getElementById('dbg-ground');
                this.dbgMap = document.getElementById('dbg-map');
                this.isDebugVisible = false;
            }

            hideStartScreen() {
                this.startScreen.style.display = 'none';
            }

            showStartScreen() {
                this.startScreen.style.display = 'flex';
            }

            toggleDebug() {
                this.isDebugVisible = !this.isDebugVisible;
                this.debugPanel.style.display = this.isDebugVisible ? 'block' : 'none';
            }

            updateDebug(fps, pos, speed, grounded, mapName) {
                if (!this.isDebugVisible) return;
                this.dbgFps.textContent = Math.round(fps);
                this.dbgPos.textContent = `X: ${pos.x.toFixed(1)} Y: ${pos.y.toFixed(1)} Z: ${pos.z.toFixed(1)}`;
                this.dbgVel.textContent = speed.toFixed(2);
                this.dbgGround.textContent = grounded;
                this.dbgMap.textContent = mapName;
            }

            updateHP(hp) { this.hpVal.textContent = Math.max(0, Math.floor(hp)); }
            updateScore(score) { this.scoreVal.textContent = score; }
            updateAmmo(current, reserve) {
                this.ammoVal.textContent = current;
                this.maxAmmoVal.textContent = reserve;
            }
        }

        /**
         * GameMap - 建立未來軍事基地 3D 地圖、高台、樓梯、掩體與 Spawn 點
         */
        class GameMap {
            constructor(scene) {
                this.scene = scene;
                this.collidables = [];
                this.playerSpawnPoint = new THREE.Vector3(0, 1.8, 25);
                this.enemySpawnPoints = [
                    new THREE.Vector3(-20, 1.8, -30),
                    new THREE.Vector3(20, 1.8, -30),
                    new THREE.Vector3(0, 1.8, -40)
                ];
            }

            build() {
                // 1. 地面
                const groundGeo = new THREE.PlaneGeometry(120, 120);
                const groundMat = new THREE.MeshStandardMaterial({ color: 0x1a222d, roughness: 0.8, metalness: 0.2 });
                const ground = new THREE.Mesh(groundGeo, groundMat);
                ground.rotation.x = -Math.PI / 2;
                ground.receiveShadow = true;
                this.scene.add(ground);

                // 科技感網格
                const grid = new THREE.GridHelper(120, 60, 0x00ffcc, 0x224455);
                grid.position.y = 0.01;
                this.scene.add(grid);

                // 材質
                const wallMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50, roughness: 0.5 });
                const containerMat1 = new THREE.MeshStandardMaterial({ color: 0x8e44ad, roughness: 0.4 });
                const containerMat2 = new THREE.MeshStandardMaterial({ color: 0x2980b9, roughness: 0.4 });
                const coverMat = new THREE.MeshStandardMaterial({ color: 0x7f8c8d, roughness: 0.7 });
                const stairMat = new THREE.MeshStandardMaterial({ color: 0x16a085, roughness: 0.5 });

                const createBox = (w, h, d, x, y, z, mat) => {
                    const geo = new THREE.BoxGeometry(w, h, d);
                    const mesh = new THREE.Mesh(geo, mat);
                    mesh.position.set(x, y, z);
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    this.scene.add(mesh);
                    this.collidables.push(mesh);
                    return mesh;
                };

                // 2. 外圍邊界圍牆 (Boundary Walls)
                createBox(120, 8, 2, 0, 4, -60, wallMat); // 北
                createBox(120, 8, 2, 0, 4, 60, wallMat);  // 南
                createBox(2, 8, 120, -60, 4, 0, wallMat); // 西
                createBox(2, 8, 120, 60, 4, 0, wallMat);  // 東

                // 3. 貨櫃區
                createBox(4, 3.5, 10, -18, 1.75, -10, containerMat1);
                createBox(4, 3.5, 10, -18, 5.25, -10, containerMat2); // 二層貨櫃
                createBox(10, 3.5, 4, 18, 1.75, -20, containerMat2);

                // 4. 掩體
                createBox(6, 1.5, 1, 0, 0.75, -8, coverMat);
                createBox(1, 1.5, 6, -10, 0.75, -20, coverMat);
                createBox(1, 1.5, 6, 10, 0.75, -20, coverMat);

                // 5. 建築物 A (指揮所與高台)
                createBox(20, 6, 16, 25, 3, 10, wallMat);
                // 二樓平台延伸
                createBox(12, 1, 12, 25, 6.5, 10, wallMat);
                this.collidables.push(this.scene.children[this.scene.children.length - 1]);

                // 6. 簡易階梯 (Stairs leading to Platform)
                for (let i = 0; i < 6; i++) {
                    createBox(3, 0.5 + (i * 0.2), 1.2, 13, 0.25 + (i * 0.5), 5 + (i * 1.1), stairMat);
                }

                // 7. 燈光柱
                const pillarGeo = new THREE.CylinderGeometry(0.5, 0.5, 10, 16);
                const pillarMat = new THREE.MeshStandardMaterial({ color: 0x34495e, metalness: 0.8 });
                
                const createLightPillar = (x, z) => {
                    const pillar = new THREE.Mesh(pillarGeo, pillarMat);
                    pillar.position.set(x, 5, z);
                    pillar.castShadow = true;
                    this.scene.add(pillar);
                    this.collidables.push(pillar);

                    const light = new THREE.PointLight(0x00ffcc, 1.5, 20);
                    light.position.set(x, 9, z);
                    this.scene.add(light);
                };

                createLightPillar(-35, -35);
                createLightPillar(35, -35);
                createLightPillar(-35, 35);
                createLightPillar(35, 35);
            }

            getCollidables() { return this.collidables; }
            getPlayerSpawn() { return this.playerSpawnPoint; }
        }

        /**
         * CollisionSystem - 負責處理玩家與地圖物件碰撞、滑牆與地板高度檢測
         */
        class CollisionSystem {
            constructor(collidables) {
                this.collidables = collidables;
            }

            // 檢查水平位置是否與物件發生 AABB 碰撞
            checkHorizontalCollision(pos, radius, height) {
                const playerBox = new THREE.Box3(
                    new THREE.Vector3(pos.x - radius, pos.y - height, pos.z - radius),
                    new THREE.Vector3(pos.x + radius, pos.y, pos.z + radius)
                );

                for (let i = 0; i < this.collidables.length; i++) {
                    const obj = this.collidables[i];
                    if (!obj.geometry.boundingBox) obj.geometry.computeBoundingBox();
                    const objBox = obj.geometry.boundingBox.clone();
                    objBox.applyMatrix4(obj.matrixWorld);

                    if (playerBox.intersectsBox(objBox)) {
                        return true;
                    }
                }
                return false;
            }

            // 射線向下檢測取得精確地板高度（支援樓梯與平台高低差）
            getGroundHeight(pos, radius, currentY) {
                const raycaster = new THREE.Raycaster();
                const rayOrigin = new THREE.Vector3(pos.x, currentY + 1.0, pos.z);
                raycaster.set(rayOrigin, new THREE.Vector3(0, -1, 0));

                const intersects = raycaster.intersectObjects(this.collidables, true);
                let highestGround = 0.0; // 地面預設高度

                for (let i = 0; i < intersects.length; i++) {
                    const hit = intersects[i];
                    // 確保交點在玩家腳部下方或剛好踏上
                    if (hit.point.y <= currentY + 0.5 && hit.point.y > highestGround) {
                        highestGround = hit.point.y;
                    }
                }
                return highestGround;
            }
        }

        /**
         * Player - 負責玩家移動、滑牆碰撞、重力與跳躍
         */
        class Player {
            constructor(camera, collisionSystem, spawnPoint) {
                this.camera = camera;
                this.collisionSystem = collisionSystem;

                this.hp = 100;
                this.height = 1.8;
                this.radius = 0.45;

                this.position = spawnPoint.clone();
                this.velocity = new THREE.Vector3();
                this.camera.position.copy(this.position);

                this.pitch = 0;
                this.yaw = 0;
                this.mouseSensitivity = 0.0022;

                this.walkSpeed = 6.5;
                this.sprintSpeed = 12.0;
                this.gravity = 28.0;
                this.jumpStrength = 10.0;
                this.isGrounded = false;
            }

            update(delta, inputManager) {
                this.handleRotation(inputManager);
                this.handleMovement(delta, inputManager);
            }

            handleRotation(inputManager) {
                const mouseDelta = inputManager.getMouseDelta();

                this.yaw -= mouseDelta.x * this.mouseSensitivity;
                this.pitch -= mouseDelta.y * this.mouseSensitivity;

                const maxPitch = Math.PI / 2 - 0.01;
                this.pitch = Math.max(-maxPitch, Math.min(maxPitch, this.pitch));

                const euler = new THREE.Euler(0, 0, 0, 'YXZ');
                euler.x = this.pitch;
                euler.y = this.yaw;
                this.camera.quaternion.setFromEuler(euler);
            }

            handleMovement(delta, inputManager) {
                const isSprint = inputManager.getKey('ShiftLeft') || inputManager.getKey('ShiftRight');
                const speed = isSprint ? this.sprintSpeed : this.walkSpeed;

                const moveDir = new THREE.Vector3();
                if (inputManager.getKey('KeyW')) moveDir.z -= 1;
                if (inputManager.getKey('KeyS')) moveDir.z += 1;
                if (inputManager.getKey('KeyA')) moveDir.x -= 1;
                if (inputManager.getKey('KeyD')) moveDir.x += 1;
                moveDir.normalize();

                const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), this.yaw);
                const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), this.yaw);

                const movement = new THREE.Vector3();
                movement.addScaledVector(forward, -moveDir.z * speed * delta);
                movement.addScaledVector(side, moveDir.x * speed * delta);

                // X 軸滑動碰撞
                this.position.x += movement.x;
                if (this.collisionSystem.checkHorizontalCollision(this.position, this.radius, this.height)) {
                    this.position.x -= movement.x;
                }

                // Z 軸滑動碰撞
                this.position.z += movement.z;
                if (this.collisionSystem.checkHorizontalCollision(this.position, this.radius, this.height)) {
                    this.position.z -= movement.z;
                }

                // 重力與跳躍
                this.velocity.y -= this.gravity * delta;
                if (inputManager.getKey('Space') && this.isGrounded) {
                    this.velocity.y = this.jumpStrength;
                    this.isGrounded = false;
                }

                this.position.y += this.velocity.y * delta;

                // 地板與高低差偵測
                const targetGroundY = this.collisionSystem.getGroundHeight(this.position, this.radius, this.position.y);
                const footY = this.position.y - this.height;

                if (footY <= targetGroundY) {
                    this.position.y = targetGroundY + this.height;
                    this.velocity.y = 0;
                    this.isGrounded = true;
                } else if (footY > targetGroundY + 0.4) {
                    this.isGrounded = false; // 懸空落下
                }

                this.camera.position.copy(this.position);
            }

            getPosition() { return this.position; }
            getVelocityMagnitude() { return new THREE.Vector2(this.velocity.x, this.velocity.z).length(); }
            getIsGrounded() { return this.isGrounded; }
        }

        /**
         * Game - 核心遊戲流程控制類別
         */
        class Game {
            constructor() {
                this.container = document.getElementById('game-container');
                this.initThree();

                this.inputManager = new InputManager();
                this.uiManager = new UIManager();

                // 綁定 F3 偵錯切換
                this.inputManager.onToggleDebug = () => this.uiManager.toggleDebug();

                // 初始化地圖與碰撞系統
                this.gameMap = new GameMap(this.scene);
                this.gameMap.build();
                this.collisionSystem = new CollisionSystem(this.gameMap.getCollidables());

                // 初始化玩家
                this.player = new Player(this.camera, this.collisionSystem, this.gameMap.getPlayerSpawn());

                this.clock = new THREE.Clock();
                this.initPointerLock();

                window.addEventListener('resize', () => this.onWindowResize());
                this.animate();
            }

            initThree() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x0b0e14);
                this.scene.fog = new THREE.FogExp2(0x0b0e14, 0.012);

                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(window.devicePixelRatio);
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                this.container.appendChild(this.renderer.domElement);

                // 燈光
                const ambientLight = new THREE.AmbientLight(0x223344, 1.2);
                this.scene.add(ambientLight);

                const mainLight = new THREE.DirectionalLight(0xaaccff, 1.6);
                mainLight.position.set(40, 60, 30);
                mainLight.castShadow = true;
                mainLight.shadow.mapSize.width = 2048;
                mainLight.shadow.mapSize.height = 2048;
                const d = 50;
                mainLight.shadow.camera.left = -d;
                mainLight.shadow.camera.right = d;
                mainLight.shadow.camera.top = d;
                mainLight.shadow.camera.bottom = -d;
                this.scene.add(mainLight);
            }

            initPointerLock() {
                const startScreen = document.getElementById('start-screen');

                startScreen.addEventListener('click', () => {
                    this.container.requestPointerLock();
                });

                document.addEventListener('pointerlockchange', () => {
                    if (document.pointerLockElement === this.container) {
                        this.inputManager.isPointerLocked = true;
                        this.uiManager.hideStartScreen();
                    } else {
                        this.inputManager.isPointerLocked = false;
                        this.uiManager.showStartScreen();
                    }
                });
            }

            onWindowResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }

            animate() {
                requestAnimationFrame(() => this.animate());

                const delta = this.clock.getDelta();
                const fps = 1 / (delta > 0 ? delta : 0.016);

                if (this.inputManager.isPointerLocked) {
                    this.player.update(delta, this.inputManager);
                }

                // 更新 Debug 資訊
                this.uiManager.updateDebug(
                    fps, 
                    this.player.getPosition(), 
                    this.player.getVelocityMagnitude(), 
                    this.player.getIsGrounded(), 
                    "MilitaryBase"
                );

                this.renderer.render(this.scene, this.camera);
            }
        }

        // 頁面載入後啟動遊戲
        window.onload = () => {
            window.game = new Game();
        };
    </script>
</body>
</html>
