<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D FPS Demo - Phase 2 (Map & Collision)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* 準星 UI */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
        }

        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background-color: rgba(0, 255, 200, 0.8);
        }

        #crosshair::before {
            top: 4px;
            left: 0;
            width: 10px;
            height: 2px;
        }

        #crosshair::after {
            top: 0;
            left: 4px;
            width: 2px;
            height: 10px;
        }

        /* HUD 抬頭顯示器 */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            padding: 20px;
            color: #00ffcc;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(0, 255, 200, 0.5);
        }

        .hud-panel {
            position: absolute;
            background: rgba(10, 20, 30, 0.65);
            border: 1px solid rgba(0, 255, 200, 0.3);
            padding: 10px 20px;
            border-radius: 4px;
            backdrop-filter: blur(4px);
        }

        #hud-top-left {
            top: 20px;
            left: 20px;
            font-size: 20px;
        }

        #hud-top-right {
            top: 20px;
            right: 20px;
            font-size: 20px;
        }

        #hud-bottom-right {
            bottom: 20px;
            right: 20px;
            font-size: 24px;
            text-align: right;
        }

        /* Phase 2: F3 Debug 面板 */
        #debug-panel {
            position: absolute;
            top: 20px;
            left: 200px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #00ffcc;
            color: #00ff00;
            font-family: monospace;
            font-size: 13px;
            padding: 12px 16px;
            border-radius: 6px;
            display: none;
            z-index: 15;
            line-height: 1.6;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(0, 255, 200, 0.2);
        }

        /* 開始畫面遮罩 */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(15,25,35,0.92) 0%, rgba(5,10,15,0.98) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            color: #fff;
            cursor: pointer;
        }

        #start-screen h1 {
            font-size: 48px;
            letter-spacing: 4px;
            color: #00ffcc;
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(0, 255, 200, 0.6);
        }

        #start-screen p {
            font-size: 20px;
            color: #88ffdd;
            border: 2px solid #00ffcc;
            padding: 12px 30px;
            border-radius: 30px;
            background: rgba(0, 255, 200, 0.1);
            transition: all 0.3s ease;
        }

        #start-screen p:hover {
            background: rgba(0, 255, 200, 0.3);
            box-shadow: 0 0 20px rgba(0, 255, 200, 0.5);
        }

        .instructions {
            margin-top: 30px;
            color: #aaa;
            font-size: 14px;
            line-height: 1.8;
            text-align: center;
        }
    </style>
    <!-- 使用 CDN 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="game-container">
        <!-- 準星 -->
        <div id="crosshair"></div>

        <!-- HUD UI -->
        <div id="hud">
            <div id="hud-top-left" class="hud-panel">HP: <span id="hp-val">100</span></div>
            <div id="hud-top-right" class="hud-panel">Score: <span id="score-val">0</span></div>
            <div id="hud-bottom-right" class="hud-panel">AMMO: <span id="ammo-val">30</span> / <span id="max-ammo-val">120</span></div>
        </div>

        <!-- Phase 2: Debug Overlay (F3 Toggle) -->
        <div id="debug-panel">
            <div>FPS: <span id="debug-fps">60</span></div>
            <div>Position: <span id="debug-pos">X: 0.0 Y: 1.8 Z: 0.0</span></div>
            <div>Velocity: <span id="debug-vel">0.0</span> (Vertical Y: <span id="debug-vy">0.0</span>)</div>
            <div>Grounded: <span id="debug-grounded">true</span></div>
            <div>Map: <span id="debug-map">MilitaryBase-Alpha</span></div>
        </div>

        <!-- 開始畫面 overlay -->
        <div id="start-screen">
            <h1>3D FPS DEMO - PHASE 2</h1>
            <p>[ CLICK TO EXPLORE BASE ]</p>
            <div class="instructions">
                <b>操作說明：</b><br>
                WASD：前後左右移動 | Shift：衝刺 | Space：跳躍<br>
                滑鼠移動：旋轉視角 | <b>F3：切換 Debug 偵錯資訊</b><br>
                <i>特色：包含完整軍事基地、樓梯高台、滑牆機制與邊界防禦</i>
            </div>
        </div>
    </div>

    <script>
        class InputManager {
            constructor() {
                this.keys = {};
                this.mouseMovementX = 0;
                this.mouseMovementY = 0;
                this.isPointerLocked = false;
                this.debugToggled = false;

                this.initListeners();
            }

            initListeners() {
                window.addEventListener('keydown', (e) => {
                    this.keys[e.code] = true;

                    // 按下 F3 切換 Debug 面板
                    if (e.code === 'F3') {
                        e.preventDefault();
                        this.debugToggled = !this.debugToggled;
                    }
                });

                window.addEventListener('keyup', (e) => {
                    this.keys[e.code] = false;
                });

                document.addEventListener('mousemove', (e) => {
                    if (this.isPointerLocked) {
                        this.mouseMovementX = e.movementX || 0;
                        this.mouseMovementY = e.movementY || 0;
                    }
                });
            }

            getKey(code) {
                return !!this.keys[code];
            }

            getMouseDelta() {
                const delta = { x: this.mouseMovementX, y: this.mouseMovementY };
                this.mouseMovementX = 0;
                this.mouseMovementY = 0;
                return delta;
            }
        }

        class UIManager {
            constructor() {
                this.startScreen = document.getElementById('start-screen');
                this.hpVal = document.getElementById('hp-val');
                this.scoreVal = document.getElementById('score-val');
                this.ammoVal = document.getElementById('ammo-val');
                this.maxAmmoVal = document.getElementById('max-ammo-val');

                // Debug UI
                this.debugPanel = document.getElementById('debug-panel');
                this.debugFps = document.getElementById('debug-fps');
                this.debugPos = document.getElementById('debug-pos');
                this.debugVel = document.getElementById('debug-vel');
                this.debugVy = document.getElementById('debug-vy');
                this.debugGrounded = document.getElementById('debug-grounded');
                this.debugMap = document.getElementById('debug-map');
            }

            hideStartScreen() {
                this.startScreen.style.display = 'none';
            }

            showStartScreen() {
                this.startScreen.style.display = 'flex';
            }

            updateHP(hp) {
                this.hpVal.textContent = Math.max(0, Math.floor(hp));
            }

            updateScore(score) {
                this.scoreVal.textContent = score;
            }

            updateAmmo(current, reserve) {
                this.ammoVal.textContent = current;
                this.maxAmmoVal.textContent = reserve;
            }

            updateDebugInfo(show, fps, pos, velHorizontal, velY, grounded, mapName) {
                if (show) {
                    this.debugPanel.style.display = 'block';
                    this.debugFps.textContent = fps;
                    this.debugPos.textContent = `X: ${pos.x.toFixed(1)} Y: ${pos.y.toFixed(1)} Z: ${pos.z.toFixed(1)}`;
                    this.debugVel.textContent = velHorizontal.toFixed(2);
                    this.debugVy.textContent = velY.toFixed(2);
                    this.debugGrounded.textContent = grounded ? "true" : "false";
                    this.debugMap.textContent = mapName;
                } else {
                    this.debugPanel.style.display = 'none';
                }
            }
        }

        class GameMap {
            constructor(scene) {
                this.scene = scene;
                this.collidables = []; // 碰撞障礙物清單
                this.mapName = "MilitaryBase-Alpha";

                // Spawn Points
                this.playerSpawn = { position: new THREE.Vector3(-35, 1.8, 35), rotationY: -Math.PI / 4 };
                this.enemySpawns = [
                    { id: 1, position: new THREE.Vector3(0, 1.8, -20) },
                    { id: 2, position: new THREE.Vector3(25, 1.8, -15) },
                    { id: 3, position: new THREE.Vector3(-20, 1.8, -25) },
                    { id: 4, position: new THREE.Vector3(30, 7.8, 10) } // 高台 Spawn
                ];

                this.materials = {
                    ground: new THREE.MeshStandardMaterial({ color: 0x161e27, roughness: 0.8, metalness: 0.2 }),
                    road: new THREE.MeshStandardMaterial({ color: 0x0f151c, roughness: 0.9 }),
                    wall: new THREE.MeshStandardMaterial({ color: 0x243342, roughness: 0.6 }),
                    accentWall: new THREE.MeshStandardMaterial({ color: 0x1c2836, roughness: 0.5 }),
                    containerBlue: new THREE.MeshStandardMaterial({ color: 0x1f5f8b, roughness: 0.4 }),
                    containerRed: new THREE.MeshStandardMaterial({ color: 0x902d2d, roughness: 0.4 }),
                    containerOrange: new THREE.MeshStandardMaterial({ color: 0xc87114, roughness: 0.4 }),
                    crate: new THREE.MeshStandardMaterial({ color: 0x5a6577, roughness: 0.7 }),
                    cover: new THREE.MeshStandardMaterial({ color: 0x3d4e5e, roughness: 0.8 }),
                    stairs: new THREE.MeshStandardMaterial({ color: 0x475868, roughness: 0.5, metalness: 0.3 }),
                    platform: new THREE.MeshStandardMaterial({ color: 0x2e3d4d, roughness: 0.6 })
                };
            }

            build() {
                this.buildGroundAndRoads();
                this.buildOuterWalls();
                this.buildBuildingA(); // 主指揮所 (含二樓高台與斜坡樓梯)
                this.buildBuildingB(); // 兵工廠/倉庫
                this.buildContainersYard();
                this.buildCoversAndCrates();
                this.buildLightingAndDecorations();
            }

            createBox(w, h, d, x, y, z, mat, isCollidable = true) {
                const geo = new THREE.BoxGeometry(w, h, d);
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(x, y, z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                this.scene.add(mesh);

                if (isCollidable) {
                    mesh.geometry.computeBoundingBox();
                    this.collidables.push(mesh);
                }
                return mesh;
            }

            buildGroundAndRoads() {
                const groundGeo = new THREE.PlaneGeometry(120, 120);
                const ground = new THREE.Mesh(groundGeo, this.materials.ground);
                ground.rotation.x = -Math.PI / 2;
                ground.receiveShadow = true;
                this.scene.add(ground);

                const grid = new THREE.GridHelper(120, 60, 0x00ffcc, 0x1a2e3b);
                grid.position.y = 0.01;
                this.scene.add(grid);

                const roadGeo = new THREE.PlaneGeometry(16, 120);
                const road = new THREE.Mesh(roadGeo, this.materials.road);
                road.rotation.x = -Math.PI / 2;
                road.position.set(0, 0.02, 0);
                road.receiveShadow = true;
                this.scene.add(road);
            }

            buildOuterWalls() {
                const wallH = 8;
                const wallT = 2;
                const size = 120;

                this.createBox(size, wallH, wallT, 0, wallH/2, -size/2, this.materials.wall);
                this.createBox(size, wallH, wallT, 0, wallH/2, size/2, this.materials.wall);
                this.createBox(wallT, wallH, size, -size/2, wallH/2, 0, this.materials.wall);
                this.createBox(wallT, wallH, size, size/2, wallH/2, 0, this.materials.wall);
            }

            buildBuildingA() {
                const bx = 25, bz = 10;

                this.createBox(20, 6, 1, bx, 3, bz - 10, this.materials.accentWall);
                this.createBox(20, 6, 1, bx, 3, bz + 10, this.materials.accentWall);
                this.createBox(1, 6, 20, bx + 10, 3, bz, this.materials.accentWall);
                
                this.createBox(1, 6, 6, bx - 10, 3, bz - 7, this.materials.accentWall);
                this.createBox(1, 6, 6, bx - 10, 3, bz + 7, this.materials.accentWall);

                const platformY = 6;
                this.createBox(20, 0.6, 20, bx, platformY, bz, this.materials.platform);

                this.createBox(20, 1.2, 0.5, bx, platformY + 0.9, bz - 10, this.materials.cover);
                this.createBox(20, 1.2, 0.5, bx, platformY + 0.9, bz + 10, this.materials.cover);
                this.createBox(0.5, 1.2, 20, bx + 10, platformY + 0.9, bz, this.materials.cover);

                const stairSteps = 12;
                const startZ = bz + 10;
                const stepLength = 0.8;
                const stepHeight = platformY / stairSteps;

                for (let i = 0; i < stairSteps; i++) {
                    const stepY = (i + 1) * stepHeight;
                    const stepZ = startZ + (i * stepLength) + 0.4;
                    this.createBox(5, stepY, stepLength, bx - 5, stepY / 2, stepZ, this.materials.stairs);
                }
            }

            buildBuildingB() {
                const bx = -28, bz = -20;

                this.createBox(18, 5, 1, bx, 2.5, bz - 8, this.materials.wall);
                this.createBox(18, 5, 1, bx, 2.5, bz + 8, this.materials.wall);
                this.createBox(1, 5, 16, bx - 9, 2.5, bz, this.materials.wall);
                
                this.createBox(1, 5, 4, bx + 9, 2.5, bz - 6, this.materials.wall);
                this.createBox(1, 5, 4, bx + 9, 2.5, bz + 6, this.materials.wall);

                this.createBox(18, 0.5, 16, bx, 5.25, bz, this.materials.platform);
            }

            buildContainersYard() {
                this.createBox(4, 3.6, 10, -15, 1.8, -5, this.materials.containerBlue);
                this.createBox(4, 3.6, 10, -15, 5.4, -5, this.materials.containerRed);

                this.createBox(10, 3.6, 4, -25, 1.8, 10, this.materials.containerOrange);
                this.createBox(4, 3.6, 10, -10, 1.8, 20, this.materials.containerBlue);

                this.createBox(2, 1.2, 2, -15, 0.6, -11.5, this.materials.crate);
                this.createBox(2, 2.4, 2, -15, 1.2, -13.5, this.materials.crate);
            }

            buildCoversAndCrates() {
                const coverLocations = [
                    { w: 6, h: 1.4, d: 1, x: 0, z: 5 },
                    { w: 1, h: 1.4, d: 6, x: -8, z: -10 },
                    { w: 1, h: 1.4, d: 6, x: 8, z: -10 },
                    { w: 5, h: 1.4, d: 1, x: 0, z: -25 },
                    { w: 1, h: 1.4, d: 8, x: 12, z: 30 },
                    { w: 6, h: 1.4, d: 1, x: -25, z: 35 }
                ];

                coverLocations.forEach(c => {
                    this.createBox(c.w, c.h, c.d, c.x, c.h / 2, c.z, this.materials.cover);
                });

                this.createBox(1.8, 1.8, 1.8, 5, 0.9, -15, this.materials.crate);
                this.createBox(1.8, 1.8, 1.8, 6.8, 0.9, -15, this.materials.crate);
                this.createBox(1.8, 1.8, 1.8, 5.9, 2.7, -15, this.materials.crate);
            }

            buildLightingAndDecorations() {
                this.scene.background = new THREE.Color(0x0a1017);
                this.scene.fog = new THREE.FogExp2(0x0a1017, 0.012);

                const pillarGeo = new THREE.CylinderGeometry(0.4, 0.4, 9, 12);
                const pillarMat = new THREE.MeshStandardMaterial({ color: 0x223344, metalness: 0.8 });

                const addLightPillar = (x, z, colorHex) => {
                    const pillar = new THREE.Mesh(pillarGeo, pillarMat);
                    pillar.position.set(x, 4.5, z);
                    pillar.castShadow = true;
                    this.scene.add(pillar);
                    this.collidables.push(pillar);

                    const light = new THREE.PointLight(colorHex, 2.5, 22);
                    light.position.set(x, 8.8, z);
                    this.scene.add(light);
                };

                addLightPillar(-45, -45, 0x00ffcc);
                addLightPillar(45, -45, 0x00aaff);
                addLightPillar(-45, 45, 0x00aaff);
                addLightPillar(45, 45, 0x00ffcc);
                addLightPillar(0, 0, 0xff9900);
            }
        }

        class CollisionSystem {
            constructor(map) {
                this.map = map;
                this.playerRadius = 0.45;
                this.stepHeight = 0.65;
            }

            movePlayer(position, intendedMovement) {
                const collidables = this.map.collidables;

                position.x += intendedMovement.x;
                if (this.checkHorizontalOverlap(position, collidables)) {
                    position.x -= intendedMovement.x;
                }

                position.z += intendedMovement.z;
                if (this.checkHorizontalOverlap(position, collidables)) {
                    position.z -= intendedMovement.z;
                }

                const maxBoundary = 58.5;
                position.x = Math.max(-maxBoundary, Math.min(maxBoundary, position.x));
                position.z = Math.max(-maxBoundary, Math.min(maxBoundary, position.z));
            }

            checkHorizontalOverlap(position, collidables) {
                const pMinX = position.x - this.playerRadius;
                const pMaxX = position.x + this.playerRadius;
                const pMinZ = position.z - this.playerRadius;
                const pMaxZ = position.z + this.playerRadius;

                const pMinY = position.y - 1.8 + this.stepHeight;
                const pMaxY = position.y;

                for (let i = 0; i < collidables.length; i++) {
                    const mesh = collidables[i];
                    const box = mesh.geometry.boundingBox.clone().applyMatrix4(mesh.matrixWorld);

                    if (pMaxX > box.min.x && pMinX < box.max.x &&
                        pMaxZ > box.min.z && pMinZ < box.max.z &&
                        pMaxY > box.min.y && pMinY < box.max.y) {
                        return true;
                    }
                }
                return false;
            }

            getGroundHeight(position) {
                let highestGround = 0;
                const pMinX = position.x - this.playerRadius;
                const pMaxX = position.x + this.playerRadius;
                const pMinZ = position.z - this.playerRadius;
                const pMaxZ = position.z + this.playerRadius;

                const playerFeetY = position.y - 1.8;

                for (let i = 0; i < this.map.collidables.length; i++) {
                    const mesh = this.map.collidables[i];
                    const box = mesh.geometry.boundingBox.clone().applyMatrix4(mesh.matrixWorld);

                    if (pMaxX > box.min.x && pMinX < box.max.x &&
                        pMaxZ > box.min.z && pMinZ < box.max.z) {
                        
                        if (box.max.y <= playerFeetY + this.stepHeight + 0.1) {
                            if (box.max.y > highestGround) {
                                highestGround = box.max.y;
                            }
                        }
                    }
                }

                return highestGround;
            }
        }

        class Player {
            constructor(camera, collisionSystem) {
                this.camera = camera;
                this.collisionSystem = collisionSystem;

                this.hp = 100;
                this.height = 1.8;

                this.position = new THREE.Vector3();
                this.velocity = new THREE.Vector3();

                this.pitch = 0;
                this.yaw = 0;
                this.mouseSensitivity = 0.002;

                this.walkSpeed = 7;
                this.sprintSpeed = 12;
                this.gravity = 26;
                this.jumpStrength = 9.5;
                this.isGrounded = false;
                this.currentHorizontalSpeed = 0;
            }

            spawn(spawnPoint) {
                this.position.copy(spawnPoint.position);
                this.yaw = spawnPoint.rotationY;
                this.pitch = 0;
                this.velocity.set(0, 0, 0);
                this.camera.position.copy(this.position);
            }

            update(delta, inputManager) {
                this.handleRotation(inputManager);
                this.handleMovement(delta, inputManager);
            }

            handleRotation(inputManager) {
                const mouseDelta = inputManager.getMouseDelta();

                this.yaw -= mouseDelta.x * this.mouseSensitivity;
                this.pitch -= mouseDelta.y * this.mouseSensitivity;

                const maxPitch = Math.PI / 2 - 0.01;
                this.pitch = Math.max(-maxPitch, Math.min(maxPitch, this.pitch));

                const euler = new THREE.Euler(0, 0, 0, 'YXZ');
                euler.x = this.pitch;
                euler.y = this.yaw;
                this.camera.quaternion.setFromEuler(euler);
            }

            handleMovement(delta, inputManager) {
                const isSprinting = inputManager.getKey('ShiftLeft') || inputManager.getKey('ShiftRight');
                const speed = isSprinting ? this.sprintSpeed : this.walkSpeed;

                const moveDirection = new THREE.Vector3();
                if (inputManager.getKey('KeyW')) moveDirection.z -= 1;
                if (inputManager.getKey('KeyS')) moveDirection.z += 1;
                if (inputManager.getKey('KeyA')) moveDirection.x -= 1;
                if (inputManager.getKey('KeyD')) moveDirection.x += 1;

                moveDirection.normalize();

                const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), this.yaw);
                const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), this.yaw);

                const intendedMovement = new THREE.Vector3();
                intendedMovement.addScaledVector(forward, -moveDirection.z * speed * delta);
                intendedMovement.addScaledVector(side, moveDirection.x * speed * delta);

                this.currentHorizontalSpeed = intendedMovement.length() / (delta || 0.016);

                this.collisionSystem.movePlayer(this.position, intendedMovement);

                const groundY = this.collisionSystem.getGroundHeight(this.position);
                const targetFeetY = groundY;

                this.velocity.y -= this.gravity * delta;

                if (inputManager.getKey('Space') && this.isGrounded) {
                    this.velocity.y = this.jumpStrength;
                    this.isGrounded = false;
                }

                this.position.y += this.velocity.y * delta;

                if (this.position.y - this.height <= targetFeetY) {
                    this.position.y = targetFeetY + this.height;
                    this.velocity.y = 0;
                    this.isGrounded = true;
                } else {
                    this.isGrounded = false;
                }

                this.camera.position.copy(this.position);
            }
        }

        class Game {
            constructor() {
                this.container = document.getElementById('game-container');

                this.initThree();
                this.inputManager = new InputManager();
                this.uiManager = new UIManager();

                this.map = new GameMap(this.scene);
                this.map.build();

                this.collisionSystem = new CollisionSystem(this.map);
                this.player = new Player(this.camera, this.collisionSystem);

                this.player.spawn(this.map.playerSpawn);

                this.clock = new THREE.Clock();
                this.fpsFrames = 0;
                this.fpsTimeAcc = 0;
                this.currentFPS = 60;

                this.initPointerLock();

                window.addEventListener('resize', () => this.onWindowResize());

                this.animate();
            }

            initThree() {
                this.scene = new THREE.Scene();

                this.camera = new THREE.PerspectiveCamera(
                    75, 
                    window.innerWidth / window.innerHeight, 
                    0.1, 
                    1000
                );

                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                this.container.appendChild(this.renderer.domElement);

                const ambientLight = new THREE.AmbientLight(0x334455, 1.2);
                this.scene.add(ambientLight);

                const sunLight = new THREE.DirectionalLight(0xbbddee, 1.6);
                sunLight.position.set(40, 60, 20);
                sunLight.castShadow = true;
                sunLight.shadow.mapSize.width = 2048;
                sunLight.shadow.mapSize.height = 2048;
                sunLight.shadow.camera.near = 0.5;
                sunLight.shadow.camera.far = 180;
                const d = 60;
                sunLight.shadow.camera.left = -d;
                sunLight.shadow.camera.right = d;
                sunLight.shadow.camera.top = d;
                sunLight.shadow.camera.bottom = -d;
                this.scene.add(sunLight);
            }

            initPointerLock() {
                const startScreen = document.getElementById('start-screen');

                startScreen.addEventListener('click', () => {
                    this.container.requestPointerLock();
                });

                document.addEventListener('pointerlockchange', () => {
                    if (document.pointerLockElement === this.container) {
                        this.inputManager.isPointerLocked = true;
                        this.uiManager.hideStartScreen();
                    } else {
                        this.inputManager.isPointerLocked = false;
                        this.uiManager.showStartScreen();
                    }
                });
            }

            onWindowResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }

            animate() {
                requestAnimationFrame(() => this.animate());

                const delta = Math.min(this.clock.getDelta(), 0.1);

                this.fpsFrames++;
                this.fpsTimeAcc += delta;
                if (this.fpsTimeAcc >= 0.5) {
                    this.currentFPS = Math.round((this.fpsFrames / this.fpsTimeAcc));
                    this.fpsFrames = 0;
                    this.fpsTimeAcc = 0;
                }

                if (this.inputManager.isPointerLocked) {
                    this.player.update(delta, this.inputManager);
                }

                this.uiManager.updateDebugInfo(
                    this.inputManager.debugToggled,
                    this.currentFPS,
                    this.player.position,
                    this.player.currentHorizontalSpeed,
                    this.player.velocity.y,
                    this.player.isGrounded,
                    this.map.mapName
                );

                this.renderer.render(this.scene, this.画面 ? this.camera : this.camera);
            }
        }

        window.onload = () => {
            window.game = new Game();
        };
    </script>
</body>
</html>
